<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교과 시수배당</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px/1.7 system-ui,'Malgun Gothic',sans-serif;color:#222;background:#fff}
    main{max-width:460px;margin:22vh auto;padding:24px}h1{font-size:23px;font-weight:600;margin:0 0 16px}p{color:#666}a{display:inline-block;background:#222;color:white;padding:10px 18px;text-decoration:none;border-radius:4px}a[hidden]{display:none}
  </style>
</head>
<body>
  <main><h1>교과 시수배당</h1><p id="message">배당표에 연결합니다.</p><a id="open" hidden target="_top">배당표 열기</a></main>
  <script src="./config.js"></script>
  <script>
    (()=>{
      const value=window.ALLOCATION_CONFIG?.webAppUrl;
      let url;try{url=new URL(value);}catch{}
      if(!url||url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/(?:macros\/s|a\/macros\/[^/]+\/s)\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)){
        document.querySelector('#message').textContent='config.js에 본인 Apps Script 웹 앱의 /exec 주소를 설정하세요.';return;
      }
      const open=document.querySelector('#open');open.href=url.href;open.hidden=false;
      document.querySelector('#message').textContent='배당표로 연결합니다. 자동으로 열리지 않으면 아래 버튼을 누르세요.';
      location.replace(url.href);
    })();
  </script>
</body>
</html>
