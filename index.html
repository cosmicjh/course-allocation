<!doctype html>
<html lang="ko">
<head>
    <script src="./config.js"></script>
  <script>const ALLOCATION_APP_ID = String(window.ALLOCATION_CONFIG?.appId || location.host);</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="교과별 과목과 분반을 설정하고 교사별 수업 시수를 배분합니다.">
  <meta name="theme-color" content="#ffffff">
  <title>교과 시수배당</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23222222'/%3E%3Cpath d='M10 11h20v4H10zm0 7h9v12h-9zm12 0h8v12h-8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./app/workbook.css">

<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div id="app"><div class="loading">교과 배당표를 불러오고 있습니다.</div></div>
  <div id="print-root"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <p id="row-order-help" class="row-order-sr">점 손잡이를 드래그해 순서를 바꿉니다. 키보드에서는 Space 또는 Enter로 선택하고 방향키로 이동한 뒤 Enter로 적용합니다. Escape로 취소합니다. 변경 후 교과군별로 저장하세요.</p>
  <div id="row-order-status" class="row-order-sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="row-drag-ghost" aria-hidden="true" hidden></div>
  <div id="row-drop-line" aria-hidden="true" hidden></div>
  <input id="hours-import-file" type="file" accept="application/json,.json" hidden>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <script id="workbook-runtime" type="module" src="./app/workbook.js"></script>
